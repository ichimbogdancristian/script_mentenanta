name: CI

on:
  push:
    branches: [master, Testing]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    name: Syntax, Analyzer, Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable | Format-List | Out-String

      # ------------------------------------------------------------------
      # 1. Syntax. Catches a typo that would otherwise only surface as
      #    "module failed to import" on a user's machine at 01:00, where
      #    the orchestrator logs a WARN and silently skips the whole pair.
      # ------------------------------------------------------------------
      - name: Parse every script and module
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 |
                     Where-Object { $_.FullName -notmatch '\\\.git\\' }
          $failed = 0
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed++
              Write-Host "::error file=$($f.FullName)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Host "    line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          Write-Host "Parsed $($files.Count) file(s); $failed with errors."
          if ($failed) { exit 1 }

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Write-Host "Pester           $((Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version)"
          Write-Host "PSScriptAnalyzer $((Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version)"

      # ------------------------------------------------------------------
      # 2. Analyzer. Errors FAIL the build (there are none today, so the
      #    gate is meaningful). Warnings are reported but do not fail:
      #    ~500 pre-existing style warnings would make CI permanently red,
      #    and a permanently red CI is worse than no CI. Tests are analysed
      #    with tests/PSScriptAnalyzerSettings.psd1, which drops the
      #    compatibility rules that misfire on Pester's dynamic Should.
      # ------------------------------------------------------------------
      - name: PSScriptAnalyzer (shipped code)
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -ErrorAction SilentlyContinue |
                 Where-Object { $_.ScriptPath -notmatch '\\tests\\' }
          $errors = @($r | Where-Object Severity -eq 'Error')
          $warns  = @($r | Where-Object Severity -eq 'Warning')

          foreach ($e in $errors) {
            Write-Host "::error file=$($e.ScriptPath),line=$($e.Line)::$($e.RuleName): $($e.Message)"
          }
          Write-Host "Analyzer: $($errors.Count) error(s), $($warns.Count) warning(s)."
          $warns | Group-Object RuleName | Sort-Object Count -Descending |
            Select-Object -First 10 |
            ForEach-Object { Write-Host ("  {0,-45} {1}" -f $_.Name, $_.Count) }

          "### PSScriptAnalyzer`n`n- Errors: **$($errors.Count)**`n- Warnings: $($warns.Count)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($errors.Count) { exit 1 }

      - name: PSScriptAnalyzer (tests)
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./tests -Recurse -Settings ./tests/PSScriptAnalyzerSettings.psd1 -ErrorAction SilentlyContinue
          $errors = @($r | Where-Object Severity -eq 'Error')
          foreach ($e in $errors) {
            Write-Host "::error file=$($e.ScriptPath),line=$($e.Line)::$($e.RuleName): $($e.Message)"
          }
          Write-Host "Test analyzer: $($errors.Count) error(s), $(@($r).Count) finding(s) total."
          if ($errors.Count) { exit 1 }

      # ------------------------------------------------------------------
      # 3. Pester. Unit tests cover pure parse/compare functions; contract
      #    tests cover $ModulePairs <-> files <-> config wiring and the
      #    shipped baseline JSON. Neither touches system state, so both run
      #    unelevated on a clean runner.
      # ------------------------------------------------------------------
      - name: Run Pester
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path            = './tests'
          $cfg.Run.PassThru        = $true
          $cfg.Output.Verbosity    = 'Detailed'
          $cfg.TestResult.Enabled  = $true
          $cfg.TestResult.OutputPath   = 'testresults.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'

          $r = Invoke-Pester -Configuration $cfg

          "### Pester`n`n- Passed: **$($r.PassedCount)**`n- Failed: **$($r.FailedCount)**`n- Duration: $([math]::Round($r.Duration.TotalSeconds,1))s" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

          foreach ($f in $r.Failed) {
            Write-Host "::error::$($f.ExpandedPath) -- $($f.ErrorRecord.Exception.Message)"
          }
          if ($r.FailedCount) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testresults.xml
          if-no-files-found: ignore
